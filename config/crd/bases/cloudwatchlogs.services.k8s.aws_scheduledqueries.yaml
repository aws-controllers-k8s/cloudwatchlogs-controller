---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: scheduledqueries.cloudwatchlogs.services.k8s.aws
spec:
  group: cloudwatchlogs.services.k8s.aws
  names:
    kind: ScheduledQuery
    listKind: ScheduledQueryList
    plural: scheduledqueries
    singular: scheduledquery
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ScheduledQuery is the Schema for the ScheduledQueries API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ScheduledQuerySpec defines the desired state of ScheduledQuery.
            properties:
              description:
                description: |-
                  An optional description for the scheduled query to help identify its purpose
                  and functionality.
                type: string
              destinationConfiguration:
                description: |-
                  Configuration for where to deliver query results. Currently supports Amazon
                  S3 destinations for storing query output.
                properties:
                  s3Configuration:
                    description: |-
                      Configuration for Amazon S3 destination where scheduled query results are
                      delivered.
                    properties:
                      destinationIdentifier:
                        type: string
                      kmsKeyID:
                        type: string
                      ownerAccountID:
                        type: string
                      roleARN:
                        type: string
                    type: object
                type: object
              executionRoleARN:
                description: |-
                  The ARN of the IAM role that grants permissions to execute the query and
                  deliver results to the specified destination. The role must have permissions
                  to read from the specified log groups and write to the destination.
                type: string
              logGroupIdentifiers:
                description: |-
                  An array of log group names or ARNs to query. You can specify between 1 and
                  50 log groups. Log groups can be identified by name or full ARN.
                items:
                  type: string
                type: array
              name:
                description: |-
                  The name of the scheduled query. The name must be unique within your account
                  and region. Valid characters are alphanumeric characters, hyphens, underscores,
                  and periods. Length must be between 1 and 255 characters.

                  Regex Pattern: `^[a-zA-Z0-9_\-/.#]+$`
                type: string
              queryLanguage:
                description: |-
                  The query language to use for the scheduled query. Valid values are CWLI,
                  PPL, and SQL.
                type: string
              queryString:
                description: |-
                  The query string to execute. This is the same query syntax used in CloudWatch
                  Logs Insights. Maximum length is 10,000 characters.
                type: string
              scheduleEndTime:
                description: |-
                  The end time for the scheduled query in Unix epoch format. The query will
                  stop executing after this time.
                format: int64
                type: integer
              scheduleExpression:
                description: |-
                  A cron expression that defines when the scheduled query runs. The expression
                  uses standard cron syntax and supports minute-level precision. Maximum length
                  is 256 characters.
                type: string
              scheduleStartTime:
                description: |-
                  The start time for the scheduled query in Unix epoch format. The query will
                  not execute before this time.
                format: int64
                type: integer
              startTimeOffset:
                description: |-
                  The time offset in seconds that defines the lookback period for the query.
                  This determines how far back in time the query searches from the execution
                  time.
                format: int64
                type: integer
              state:
                description: |-
                  The initial state of the scheduled query. Valid values are ENABLED and DISABLED.
                  Default is ENABLED.
                type: string
              tags:
                additionalProperties:
                  type: string
                description: |-
                  Key-value pairs to associate with the scheduled query for resource management
                  and cost allocation.
                type: object
              timezone:
                description: |-
                  The timezone for evaluating the schedule expression. This determines when
                  the scheduled query executes relative to the specified timezone.
                type: string
            required:
            - executionRoleARN
            - name
            - queryLanguage
            - queryString
            - scheduleExpression
            type: object
          status:
            description: ScheduledQueryStatus defines the observed state of ScheduledQuery
            properties:
              ackResourceMetadata:
                description: |-
                  All CRs managed by ACK have a common `Status.ACKResourceMetadata` member
                  that is used to contain resource sync state, account ownership,
                  constructed ARN for the resource
                properties:
                  arn:
                    description: |-
                      ARN is the Amazon Resource Name for the resource. This is a
                      globally-unique identifier and is set only by the ACK service controller
                      once the controller has orchestrated the creation of the resource OR
                      when it has verified that an "adopted" resource (a resource where the
                      ARN annotation was set by the Kubernetes user on the CR) exists and
                      matches the supplied CR's Spec field values.
                      https://github.com/aws/aws-controllers-k8s/issues/270
                    type: string
                  ownerAccountID:
                    description: |-
                      OwnerAccountID is the AWS Account ID of the account that owns the
                      backend AWS service API resource.
                    type: string
                  partition:
                    description: Partition is the AWS partition in which the resource
                      exists or will exist
                    type: string
                  region:
                    description: Region is the AWS region in which the resource exists
                      or will exist.
                    type: string
                required:
                - ownerAccountID
                - region
                type: object
              conditions:
                description: |-
                  All CRs managed by ACK have a common `Status.Conditions` member that
                  contains a collection of `ackv1alpha1.Condition` objects that describe
                  the various terminal states of the CR and its backend AWS service API
                  resource
                items:
                  description: |-
                    Condition is the common struct used by all CRDs managed by ACK service
                    controllers to indicate terminal states  of the CR and its backend AWS
                    service API resource
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the Condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
