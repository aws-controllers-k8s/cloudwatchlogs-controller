sdk_names:
  model_name: cloudwatch-logs
  client_interface: CloudWatchLogsAPI
  client_struct: CloudWatchLogs
ignore:
  resource_names:
    - Delivery
    - ExportTask
    - ImportTask
    - ScheduledQuery
    #- LogGroup
    - LogStream
    - LogAnomalyDetector
  field_paths:
    - PutSubscriptionFilterInput.LogGroupName
    - PutResourcePolicyInput.ExpectedRevisionId
    - CreateLogGroupInput.LogGroupClass
    - PutSubscriptionFilterInput.ApplyOnTransformedLogs
operations:
  PutResourcePolicy:
    resource_name: ResourcePolicy
    operation_type: Create
    output_wrapper_field_path: ResourcePolicy
resources:
  LogGroup:
    exceptions:
      terminal_codes:
        - InvalidParameterException
    fields:
      Name:
        type: string
        is_primary_key: true
      KMSKeyID:
        references:
          resource: Key
          service_name: kms
          path: Status.ACKResourceMetadata.ARN
      SubscriptionFilters:
        custom_field:
          list_of: PutSubscriptionFilterInput
      RetentionDays:
        from:
          operation: PutRetentionPolicy
          path: RetentionInDays
      CreationTime:
        is_read_only: true
        from:
          operation: DescribeLogGroups
          path: LogGroups.CreationTime
      DataProtectionStatus:
        is_read_only: true
        from:
          operation: DescribeLogGroups
          path: LogGroups.DataProtectionStatus
      MetricFilterCount:
        is_read_only: true
        from:
          operation: DescribeLogGroups
          path: LogGroups.MetricFilterCount
      RetentionInDays:
        is_read_only: true
        from:
          operation: DescribeLogGroups
          path: LogGroups.RetentionInDays
      StoredBytes:
        is_read_only: true
        from:
          operation: DescribeLogGroups
          path: LogGroups.StoredBytes
    renames:
      operations:
        DescribeLogGroups:
          input_fields:
            LogGroupNamePrefix: Name
        CreateLogGroup:
          input_fields:
            LogGroupName: Name
        DeleteLogGroup:
          input_fields:
            LogGroupName: Name
    hooks:
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
      sdk_create_post_set_output:
        template_path: hooks/log_group/sdk_create_post_set_output.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/log_group/sdk_read_many_post_set_output.go.tpl
    update_operation:
      custom_method_name: customUpdateLogGroup
  ResourcePolicy:
    exceptions:
      terminal_codes:
        - InvalidParameterException
        - LimitExceededException
    fields:
      PolicyName:
        is_primary_key: true
        is_immutable: true
      PolicyDocument:
        is_iam_policy: true
      ResourceArn:
        is_immutable: true
      LastUpdatedTime:
        is_read_only: true
      PolicyScope:
        is_read_only: true
      RevisionId:
        is_read_only: true
    list_operation:
      match_fields:
        - PolicyName
    tags:
      ignore: true
    update_operation:
      custom_method_name: customUpdateResourcePolicy
