sdk_names:
  model_name: cloudwatch-logs
  client_interface: CloudWatchLogsAPI
  client_struct: CloudWatchLogs
ignore:
  resource_names:
    - Delivery
    - ExportTask
    - ImportTask
    - ScheduledQuery
    #- LogGroup
    - LogStream
    - LogAnomalyDetector
  field_paths:
    - PutSubscriptionFilterInput.LogGroupName
    - PutResourcePolicyInput.ExpectedRevisionId
    - CreateLogGroupInput.LogGroupClass
    - PutSubscriptionFilterInput.ApplyOnTransformedLogs
    - CreateLogGroupInput.DeletionProtectionEnabled
    - PutSubscriptionFilterInput.EmitSystemFields
    - PutSubscriptionFilterInput.FieldSelectionCriteria
operations:
  # CloudWatch Logs exposes both DescribeLogGroups and ListLogGroups as
  # candidate ReadMany (List) operations for LogGroup. The generator's
  # heuristic picks ListLogGroups, but that API has no name-prefix filter and
  # returns a slim LogGroupSummary, which breaks exact-name lookups and drops
  # status fields. Pin the ReadMany operation to DescribeLogGroups explicitly.
  DescribeLogGroups:
    resource_name: LogGroup
    operation_type: List
  PutResourcePolicy:
    resource_name: ResourcePolicy
    # PutResourcePolicy is an idempotent upsert, so it serves as both the
    # Create and Update operation. Mapping it to Update lets the generator emit
    # a standard sdkUpdate; the ExpectedRevisionId injection needed for
    # resource-scoped policies is handled by the sdk_update_post_build_request
    # hook rather than a full custom update method.
    operation_type:
      - Create
      - Update
    output_wrapper_field_path: ResourcePolicy
resources:
  LogGroup:
    exceptions:
      terminal_codes:
        - InvalidParameterException
    fields:
      Name:
        type: string
        is_primary_key: true
      KMSKeyID:
        references:
          resource: Key
          service_name: kms
          path: Status.ACKResourceMetadata.ARN
      SubscriptionFilters:
        custom_field:
          list_of: PutSubscriptionFilterInput
      RetentionDays:
        from:
          operation: PutRetentionPolicy
          path: RetentionInDays
      CreationTime:
        is_read_only: true
        from:
          operation: DescribeLogGroups
          path: LogGroups.CreationTime
      DataProtectionStatus:
        is_read_only: true
        from:
          operation: DescribeLogGroups
          path: LogGroups.DataProtectionStatus
      MetricFilterCount:
        is_read_only: true
        from:
          operation: DescribeLogGroups
          path: LogGroups.MetricFilterCount
      RetentionInDays:
        is_read_only: true
        from:
          operation: DescribeLogGroups
          path: LogGroups.RetentionInDays
      StoredBytes:
        is_read_only: true
        from:
          operation: DescribeLogGroups
          path: LogGroups.StoredBytes
    renames:
      operations:
        DescribeLogGroups:
          input_fields:
            LogGroupNamePrefix: Name
        CreateLogGroup:
          input_fields:
            LogGroupName: Name
        DeleteLogGroup:
          input_fields:
            LogGroupName: Name
    hooks:
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
      sdk_create_post_set_output:
        template_path: hooks/log_group/sdk_create_post_set_output.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/log_group/sdk_read_many_post_set_output.go.tpl
    update_operation:
      custom_method_name: customUpdateLogGroup
  ResourcePolicy:
    # ResourcePolicy has no single mandatory identifier: account-scoped policies
    # are keyed by PolicyName while resource-scoped policies are keyed by
    # ResourceARN. PolicyName is designated the primary key so identifier code
    # still generates, and is_primary_key_optional makes adoption populate
    # whichever identifier fields the user supplies without requiring PolicyName.
    is_primary_key_optional: true
    exceptions:
      terminal_codes:
        - InvalidParameterException
    fields:
      PolicyName:
        is_primary_key: true
        is_immutable: true
      PolicyDocument:
        is_iam_policy: true
      ResourceArn:
        is_immutable: true
      LastUpdatedTime:
        is_read_only: true
      PolicyScope:
        is_read_only: true
      RevisionId:
        is_read_only: true
    list_operation:
      match_fields:
        - PolicyName
    tags:
      ignore: true
    hooks:
      # Resource-scoped policies (Spec.ResourceARN set, no PolicyName) are keyed
      # by ARN and carry a revision ID. These hooks tailor the shared
      # PutResourcePolicy/DescribeResourcePolicies/DeleteResourcePolicy calls for
      # that case; all are guarded on Spec.ResourceARN so the account-scoped path
      # is unchanged.
      sdk_read_many_post_build_request:
        template_path: hooks/resource_policy/sdk_read_many_post_build_request.go.tpl
      sdk_update_post_build_request:
        template_path: hooks/resource_policy/sdk_update_post_build_request.go.tpl
      sdk_delete_post_build_request:
        template_path: hooks/resource_policy/sdk_delete_post_build_request.go.tpl
      # PutResourcePolicy returns the revision ID for resource-scoped policies
      # only at the top level of the response, not in the nested ResourcePolicy
      # shape the generated field mapping reads. These hooks copy the top-level
      # value into Status.RevisionID so it survives create and update.
      sdk_create_post_set_output:
        template_path: hooks/resource_policy/sdk_create_post_set_output.go.tpl
      sdk_update_post_set_output:
        template_path: hooks/resource_policy/sdk_update_post_set_output.go.tpl
